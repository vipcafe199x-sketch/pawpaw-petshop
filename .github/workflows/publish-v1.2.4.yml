name: Publish v1.2.4

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.2.4.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-v1.2.4
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b32548f73d4327beb3e0e44907eaed1bf29420bf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: vipcafe199x-sketch/pawpaw-petshop
      RELEASE_SHA: b32548f73d4327beb3e0e44907eaed1bf29420bf
    steps:
      - name: Publish the tested commit
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.4 >/dev/null 2>&1; then
            test "$(gh api repos/$GH_REPO/git/ref/tags/v1.2.4 --jq .object.sha)" = "$RELEASE_SHA"
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## Giỏ hàng và bộ đếm sau lọc
          - PAWPAW10 đã được sửa riêng qua form quản trị từ 30% về 10% theo yêu cầu; các điều kiện khác giữ nguyên. Không reseed mã khi deploy.
          - Báo giá trả điều kiện coupon; giỏ/checkout dùng điều kiện server thay cho mô tả 10% viết cứng. 320.000₫ với 10% và miễn ship còn 288.000₫.
          - Đầu/cuối danh sách cùng đếm số sản phẩm hiện sau lọc, gồm CatLove, không có kết quả và xóa bộ lọc. Ưu tiên brand thật, fallback tên cho dữ liệu cũ.

          ## Kiểm chứng
          37 API/database tests + 27 DOM tests, CI chạy lại trước phát hành. Có kiểm tra báo giá/đơn QA và trường hợp cấu hình tỷ lệ thay đổi.
          Không đặt đơn thật hoặc thay đổi đơn/tồn khi test quote. Deploy sao lưu, kiểm tra catalog không đổi và health/build v1.2.4.
          Không tự sửa lại cấu hình coupon, không xuất database/backup production vào log GitHub.
          Chi tiết: docs/followup-v1.2.4.md.

          NOTES
          gh release create v1.2.4 --target "$RELEASE_SHA" --title "v1.2.4 — Đồng bộ mức giảm coupon và số lượng sau lọc" --notes-file release-notes.md --latest
  deploy:
    needs: release
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout tested commit
        run: |
          git -C /opt/pawpaw fetch --tags origin
          git -C /opt/pawpaw checkout --detach b32548f73d4327beb3e0e44907eaed1bf29420bf
      - name: Protect database and restart
        shell: bash
        run: |
          set -euo pipefail
          docker build -t pawpaw-petshop /opt/pawpaw
          docker stop pawpaw
          trap 'docker start pawpaw >/dev/null 2>&1 || true' ERR
          docker run --rm --network none --env-file /opt/pawpaw/.env -v pawpaw-data:/app/data pawpaw-petshop python -m backend.deployment_guard --data-root /app/data
          docker rm pawpaw
          trap - ERR
          docker run -d --restart unless-stopped --name pawpaw -p 127.0.0.1:8001:8000 --env-file /opt/pawpaw/.env -v pawpaw-data:/app/data pawpaw-petshop
      - name: Verify health
        run: |
          sleep 5
          curl -fsS http://127.0.0.1:8001/api/health
          curl -fsS https://pawpaw-petshop.mooo.com/api/health
          curl -fsS http://127.0.0.1:8001/ | grep -q 'data-build="v1.2.4"'
          curl -fsS http://127.0.0.1:8001/static/admin.js?v=v1.2.4 -o /tmp/pawpaw-admin-v1.2.4.js
          test -s /tmp/pawpaw-admin-v1.2.4.js
